syntax = "proto3";
package xolo.plugin.v1;
option go_package = "github.com/xolo-gateway/xolo/pkg/pluginsdk/proto";

service XoloPlugin {
  rpc Describe(DescribeRequest) returns (PluginDescriptor);
  rpc Initialize(InitializeRequest) returns (InitializeResponse);
  rpc PreRequest(PreRequestInput) returns (PreRequestOutput);
  rpc PostResponse(PostResponseInput) returns (PostResponseOutput);
  rpc ResolveModel(ResolveModelInput) returns (ResolveModelOutput);
  rpc ListModels(ListModelsInput) returns (ListModelsOutput);
  rpc ListTools(ListToolsInput) returns (ListToolsOutput);
  rpc CallTool(CallToolInput) returns (CallToolOutput);
  rpc InspectToolResult(InspectToolResultInput) returns (InspectToolResultOutput);
}

service XoloHostService {
  rpc GetConfig(GetConfigRequest) returns (GetConfigResponse);
  rpc SaveConfig(SaveConfigRequest) returns (SaveConfigResponse);
  rpc ListModels(ListModelsForOrgRequest) returns (ListModelsForOrgResponse);
  rpc GetSecret(GetSecretRequest) returns (GetSecretResponse);
  rpc SetSecret(SetSecretRequest) returns (SetSecretResponse);
  rpc DeleteSecret(DeleteSecretRequest) returns (DeleteSecretResponse);
  rpc EmitEvent(EmitEventRequest) returns (EmitEventResponse);
  // ChatCompletion lets a plugin call a model of the requesting org through
  // the gateway itself (real or virtual model, resolved like any request).
  rpc ChatCompletion(HostChatCompletionRequest) returns (HostChatCompletionResponse);
}

message EmitEventRequest {
  string plugin_name = 1;
  string org_id = 2;
  string user_id = 3;
  string type = 4;
  string severity = 5;
  string message = 6;
  map<string, string> attributes = 7;
}
message EmitEventResponse {}

message ListModelsForOrgRequest {
  string org_id = 1;
}
message ListModelsForOrgResponse {
  repeated ModelInfo models = 1;
}

message ChatMessage {
  string role = 1;    // system | user | assistant
  string content = 2;
}

message HostChatCompletionRequest {
  string org_id = 1;
  string user_id = 2;
  // model is the proxy name to call, as a user of the org would name it.
  string model = 3;
  repeated ChatMessage messages = 4;
  double temperature = 5;
  int32 max_tokens = 6;
  // json_response asks the model for a JSON object (response_format).
  bool json_response = 7;
}

message HostChatCompletionResponse {
  string content = 1;
  int64 prompt_tokens = 2;
  int64 completion_tokens = 3;
  // resolved_model is the real model that answered.
  string resolved_model = 4;
}

message InitializeRequest {
  uint32 host_service_broker_id = 1;
}
message InitializeResponse {
  uint32 http_ui_port = 1;
}

message GetConfigRequest {
  string org_id     = 1;
  string plugin_name = 2;
}
message GetConfigResponse {
  string config_json = 1;
}
message SaveConfigRequest {
  string org_id      = 1;
  string plugin_name = 2;
  string config_json = 3;
}
message SaveConfigResponse {}

message GetSecretRequest {
  string org_id      = 1;
  string plugin_name = 2;
  string node_id     = 3;
  string key         = 4;
}
message GetSecretResponse {
  string value = 1;
  bool   found = 2;
}
message SetSecretRequest {
  string org_id      = 1;
  string plugin_name = 2;
  string node_id      = 3;
  string key          = 4;
  string value        = 5;
}
message SetSecretResponse {}
message DeleteSecretRequest {
  string org_id      = 1;
  string plugin_name = 2;
  string node_id     = 3;
  string key         = 4;
}
message DeleteSecretResponse {}

message DescribeRequest {}

// PortDescriptor describes a typed input or output port of a plugin node.
message PortDescriptor {
  string name      = 1;
  string port_type = 2; // "request" | "response" | "number" | "string" | "boolean"
  bool   required  = 3;
}

message PluginDescriptor {
  string name = 1;
  string version = 2;
  string description = 3;
  repeated Capability capabilities = 4;
  enum Capability {
    CAPABILITY_UNSPECIFIED = 0;
    PRE_REQUEST = 1;
    POST_RESPONSE = 2;
    RESOLVE_MODEL = 3;
    LIST_MODELS = 4;
    TOOL_PROVIDER = 5;
    TOOL_RESULT_INSPECTOR = 6;
  }
  string config_schema = 5;
  string user_config_schema = 6;
  bool default_required = 7;
  repeated PortDescriptor input_ports  = 8; // typed input ports for pipeline graph
  repeated PortDescriptor output_ports = 9; // typed output ports for pipeline graph
}

message RequestContext {
  string org_id = 1;
  string user_id = 2;
  string token_id = 3;
  string config_json = 4;
  string user_config_json = 5;
  string display_name = 6;
  // node_id is the stable ID of this node instance within its pipeline graph.
  // Plugins use it to scope GetSecret/SetSecret calls to this specific placement.
  string node_id = 7;
}

message ModelInfo {
  string proxy_name = 1;
  string real_model = 2;
  string provider_id = 3;
  double prompt_cost_per_1k_tokens = 4;
  double completion_cost_per_1k_tokens = 5;
  int64 token_limit = 6;
  bool is_virtual = 7;
  int64 context_length = 8;
  bool supports_vision = 9;
  bool supports_files = 10;
  float active_params_billions = 11;
  bool supports_reasoning = 12;
  bool supports_embeddings = 13;
}

message QuotaInfo {
  double daily_remaining = 1;
  double daily_total = 2;
  double monthly_remaining = 3;
  double monthly_total = 4;
  double yearly_remaining = 5;
  double yearly_total = 6;
}

message VirtualModelInfo {
  string id = 1;
  string name = 2;
  string org_id = 3;
  string description = 4;
}

message PreRequestInput {
  RequestContext ctx = 1;
  string model = 2;
  string messages_json = 3;
  // inputs_json contains the values of connected input ports as a JSON object
  // {portName: value}. Populated by the pipeline engine from upstream node outputs.
  string inputs_json = 4;
  // quota describes the remaining budget of the requesting user/org. It is
  // unset when no quota applies or when the host could not resolve it.
  QuotaInfo quota = 5;
}

message PreRequestOutput {
  bool allowed = 1;
  string rejection_reason = 2;
  string response_json = 3;
  // modified_messages_json, when non-empty, replaces the request messages.
  string modified_messages_json = 4;
  // node_state is an opaque byte blob the plugin can use to correlate
  // PreRequest with its corresponding PostResponse call in the same pipeline
  // execution (e.g. store a pseudonymisation mapping).
  bytes node_state = 5;
  // outputs_json contains the values produced on output ports as a JSON object
  // {portName: value}. The pipeline engine stores these for downstream nodes.
  string outputs_json = 6;
  // no_response_rewrite lets a POST_RESPONSE plugin tell the host that, for
  // this particular execution, it will not rewrite the response content (e.g.
  // the pseudonymizer found nothing to anonymize). The host can then forward a
  // streaming response chunk by chunk instead of buffering it whole.
  //
  // The default (false) means "may rewrite", so plugins that ignore this field
  // keep the buffered behaviour.
  bool no_response_rewrite = 7;
}

message PostResponseInput {
  RequestContext ctx = 1;
  string model = 2;
  int64 prompt_tokens = 3;
  int64 completion_tokens = 4;
  bool had_error = 5;
  // response_content is the full LLM response text passed for post-processing.
  string response_content = 6;
  // node_state is the opaque blob returned by the plugin's PreRequest call
  // for the same pipeline execution.
  bytes node_state = 7;
}

message PostResponseOutput {
  // modified_response_content, when non-empty, replaces the LLM response
  // sent back to the client (enables response transformation e.g. de-pseudonymisation).
  string modified_response_content = 1;
}

message ResolveModelInput {
  RequestContext ctx = 1;
  string requested_model = 2;
  repeated ModelInfo available_models = 3;
  string messages_json = 4;
  repeated VirtualModelInfo virtual_models = 5;
  QuotaInfo quota = 6;
  string body_json = 7;
}

message ResolveModelOutput {
  string resolved_proxy_name = 1;
  // response_content, when non-empty, instructs the proxy to short-circuit the
  // request and return the provided text directly without calling any real LLM.
  string response_content = 2;
}

message ListModelsInput {
  RequestContext ctx = 1;
  repeated ModelInfo available_models = 2;
}

message ListModelsOutput {
  repeated string additional_proxy_names = 1;
}

message ToolDescriptor {
  string name = 1;
  string description = 2;
  // input_schema_json is a JSON Schema object describing the tool's parameters.
  string input_schema_json = 3;
}

message ListToolsInput {
  RequestContext ctx = 1;
}
message ListToolsOutput {
  repeated ToolDescriptor tools = 1;
  // max_consecutive_tool_calls bounds how many consecutive tool-resolution
  // rounds the host's tool loop performs before forcing tool_choice="none"
  // on the next LLM call, so the model answers with whatever results it
  // already has instead of looping further. <= 0 means "use host default".
  int32 max_consecutive_tool_calls = 2;
}

message CallToolInput {
  RequestContext ctx = 1;
  string name = 2;
  string arguments_json = 3;
}
message CallToolOutput {
  string result_text = 1;
  bool is_error = 2;
}

// InspectToolResultInput carries a single tool result (a tool message the
// gateway fetched itself, e.g. from an MCP server) for inspection before it
// is fed back to the model. This is the indirect-injection surface that
// PreRequest never sees, because the gateway resolves these calls inside the
// model loop.
message InspectToolResultInput {
  RequestContext ctx = 1;
  string tool_name = 2;
  string content = 3;
}

message InspectToolResultOutput {
  // blocked asks the gateway to abort the request rather than feed this
  // result to the model.
  bool blocked = 1;
  // reason is returned to the client when blocked.
  string reason = 2;
  // risk is the assessed injection risk in [0, 1], for logging.
  double risk = 3;
}
