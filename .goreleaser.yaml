version: 2

before:
  hooks:
    - go mod tidy

builds:
  - id: xolo-server
    goos: [linux]
    goarch: [amd64, arm64]
    mod_timestamp: "{{ .CommitTimestamp }}"
    dir: ./cmd/server
    binary: xolo-server
    flags:
      - -trimpath
    ldflags:
      - -w -s -X 'github.com/xolo-gateway/xolo/internal/build.ShortVersion={{ .Version }}' -X 'github.com/xolo-gateway/xolo/internal/build.LongVersion={{ .Version }}'

  - id: xolo-migrate
    goos: [linux]
    goarch: [amd64, arm64]
    mod_timestamp: "{{ .CommitTimestamp }}"
    dir: ./cmd/migrate
    binary: xolo-migrate
    flags:
      - -trimpath
    ldflags:
      - -w -s

  - id: xolo-adoption
    goos: [linux]
    goarch: [amd64, arm64]
    mod_timestamp: "{{ .CommitTimestamp }}"
    dir: ./cmd/adoption
    binary: xolo-adoption
    flags:
      - -trimpath
    ldflags:
      - -w -s

  - id: xolo-plugin-time-restriction
    goos: [linux]
    goarch: [amd64, arm64]
    mod_timestamp: "{{ .CommitTimestamp }}"
    dir: ./plugins/time-restriction
    binary: xolo-plugin-time-restriction
    flags:
      - -trimpath
    ldflags:
      - -w -s

  - id: xolo-plugin-dummy-model
    goos: [linux]
    goarch: [amd64, arm64]
    mod_timestamp: "{{ .CommitTimestamp }}"
    dir: ./plugins/dummy-model
    binary: xolo-plugin-dummy-model
    flags:
      - -trimpath
    ldflags:
      - -w -s

  - id: xolo-plugin-fuzzy-evaluator
    goos: [linux]
    goarch: [amd64, arm64]
    mod_timestamp: "{{ .CommitTimestamp }}"
    dir: ./plugins/fuzzy-evaluator
    binary: xolo-plugin-fuzzy-evaluator
    flags:
      - -trimpath
    ldflags:
      - -w -s

  - id: xolo-plugin-request-inspector
    goos: [linux]
    goarch: [amd64, arm64]
    mod_timestamp: "{{ .CommitTimestamp }}"
    dir: ./plugins/request-inspector
    binary: xolo-plugin-request-inspector
    flags:
      - -trimpath
    ldflags:
      - -w -s

  - id: xolo-plugin-complexity-scorer
    goos: [linux]
    goarch: [amd64, arm64]
    mod_timestamp: "{{ .CommitTimestamp }}"
    dir: ./plugins/complexity-scorer
    binary: xolo-plugin-complexity-scorer
    flags:
      - -trimpath
    ldflags:
      - -w -s

  - id: xolo-plugin-text-classifier
    goos: [linux]
    goarch: [amd64, arm64]
    mod_timestamp: "{{ .CommitTimestamp }}"
    dir: ./plugins/text-classifier
    binary: xolo-plugin-text-classifier
    flags:
      - -trimpath
    ldflags:
      - -w -s

  - id: xolo-plugin-prompt-guard
    goos: [linux]
    goarch: [amd64, arm64]
    mod_timestamp: "{{ .CommitTimestamp }}"
    dir: ./plugins/prompt-guard
    binary: xolo-plugin-prompt-guard
    flags:
      - -trimpath
    ldflags:
      - -w -s

  - id: xolo-plugin-llm-classifier
    goos: [linux]
    goarch: [amd64, arm64]
    mod_timestamp: "{{ .CommitTimestamp }}"
    dir: ./plugins/llm-classifier
    binary: xolo-plugin-llm-classifier
    flags:
      - -trimpath
    ldflags:
      - -w -s

  - id: xolo-plugin-energy-estimator
    goos: [linux]
    goarch: [amd64, arm64]
    mod_timestamp: "{{ .CommitTimestamp }}"
    dir: ./plugins/energy-estimator
    binary: xolo-plugin-energy-estimator
    flags:
      - -trimpath
    ldflags:
      - -w -s

  - id: xolo-plugin-budget-pressure
    goos: [linux]
    goarch: [amd64, arm64]
    mod_timestamp: "{{ .CommitTimestamp }}"
    dir: ./plugins/budget-pressure
    binary: xolo-plugin-budget-pressure
    flags:
      - -trimpath
    ldflags:
      - -w -s

  - id: xolo-plugin-script-processor
    goos: [linux]
    goarch: [amd64, arm64]
    mod_timestamp: "{{ .CommitTimestamp }}"
    dir: ./plugins/script-processor
    binary: xolo-plugin-script-processor
    flags:
      - -trimpath
    ldflags:
      - -w -s

  - id: xolo-plugin-pseudonymizer
    goos: [linux]
    goarch: [amd64, arm64]
    mod_timestamp: "{{ .CommitTimestamp }}"
    dir: ./plugins/pseudonymizer
    binary: xolo-plugin-pseudonymizer
    flags:
      - -trimpath
    ldflags:
      - -w -s

  - id: xolo-plugin-mcp-bridge
    goos: [linux]
    goarch: [amd64, arm64]
    mod_timestamp: "{{ .CommitTimestamp }}"
    dir: ./plugins/mcp-bridge
    binary: xolo-plugin-mcp-bridge
    flags:
      - -trimpath
    ldflags:
      - -w -s

  - id: xolo-plugin-system-prompt
    goos: [linux]
    goarch: [amd64, arm64]
    mod_timestamp: "{{ .CommitTimestamp }}"
    dir: ./plugins/system-prompt
    binary: xolo-plugin-system-prompt
    flags:
      - -trimpath
    ldflags:
      - -w -s

checksum:
  name_template: "checksums.txt"
snapshot:
  version_template: "{{ incpatch .Version }}-next"
changelog:
  sort: asc
  abbrev: 7
  filters:
    exclude:
      - "^docs:"
      - "^test:"

release:
  name_template: "v{{ .Version }}"

dockers:
  - id: xolo-server
    ids:
      - xolo-server
      - xolo-migrate
      - xolo-adoption
      - xolo-plugin-time-restriction
      - xolo-plugin-dummy-model
      - xolo-plugin-fuzzy-evaluator
      - xolo-plugin-request-inspector
      - xolo-plugin-complexity-scorer
      - xolo-plugin-text-classifier
      - xolo-plugin-prompt-guard
      - xolo-plugin-llm-classifier
      - xolo-plugin-energy-estimator
      - xolo-plugin-budget-pressure
      - xolo-plugin-script-processor
      - xolo-plugin-pseudonymizer
      - xolo-plugin-mcp-bridge
      - xolo-plugin-system-prompt
    use: docker
    dockerfile: misc/docker/xolo-server.Dockerfile
    image_templates:
      - ghcr.io/{{ tolower ( .Env.REPO_OWNER ) }}/xolo-server:{{ .Version }}
      - ghcr.io/{{ tolower ( .Env.REPO_OWNER ) }}/xolo-server:latest
