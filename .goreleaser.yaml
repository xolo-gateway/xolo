nfpms:
  - id: xolo
    package_name: xolo
    ids:
      - xolo-server
      - xolo-migrate
      - xolo-adoption
    formats: [deb, rpm]
    file_name_template: "{{ .ConventionalFileName }}"
    vendor: Xolo
    homepage: https://xolo-gateway.org
    maintainer: William Petit <wpetit@cadoles.com>
    description: |-
      Xolo LLM gateway
      Self-hosted gateway between an organization and its LLM providers:
      OpenAI-compatible API, authentication, quotas, usage accounting and a
      web administration interface.
    license: AGPL-3.0-only
    section: net
    bindir: /usr/bin
    suggests:
      - xolo-plugin-all
    contents:
      - src: misc/packaging/xolo.service
        dst: /usr/lib/systemd/system/xolo.service
      - src: misc/packaging/xolo-admin
        dst: /usr/bin/xolo-admin
        file_info:
          mode: 0755
      - src: misc/packaging/xolo.sysusers
        dst: /usr/lib/sysusers.d/xolo.conf
      - dst: /etc/xolo
        type: dir
        file_info:
          mode: 0755
      - src: misc/packaging/xolo.env
        dst: /etc/xolo/xolo.env
        type: config|noreplace
        file_info:
          mode: 0640
          owner: root
          group: xolo
      - dst: /usr/lib/xolo/plugins
        type: dir
        file_info:
          mode: 0755
      # Also created by StateDirectory= on start; here for xolo-admin, which
      # may run before the service ever started.
      - dst: /var/lib/xolo
        type: dir
        file_info:
          mode: 0750
          owner: xolo
          group: xolo
      - src: LICENSE.md
        dst: /usr/share/doc/xolo/LICENSE.md
      - src: LICENSE-EXCEPTION
        dst: /usr/share/doc/xolo/LICENSE-EXCEPTION
    scripts:
      preinstall: misc/packaging/scripts/preinstall.sh
      postinstall: misc/packaging/scripts/postinstall.sh
      preremove: misc/packaging/scripts/preremove.sh
      postremove: misc/packaging/scripts/postremove.sh
    deb:
      # Calls the post-installation script of xolo once per dpkg run that
      # installs, upgrades or removes plugins: one restart for all of them.
      triggers:
        interest_noawait:
          - /usr/lib/xolo/plugins
    rpm:
      group: System Environment/Daemons
      # xz is read by every rpm since RHEL 6; zstd would be too, from RHEL 8.
      compression: xz

  - id: xolo-plugin-time-restriction
    package_name: xolo-plugin-time-restriction
    ids:
      - xolo-plugin-time-restriction
    formats: [deb, rpm]
    file_name_template: "{{ .ConventionalFileName }}"
    vendor: Xolo
    homepage: https://xolo-gateway.org
    maintainer: William Petit <wpetit@cadoles.com>
    license: AGPL-3.0-only
    section: net
    description: |-
      Xolo plugin time-restriction
      Restricts access to the LLM proxy to weekly time slots set per organization.
    bindir: /usr/lib/xolo/plugins
    dependencies:
      - xolo
    scripts:
      postinstall: misc/packaging/scripts/plugin-postinstall.sh
      postremove: misc/packaging/scripts/plugin-postremove.sh
    rpm:
      group: System Environment/Daemons
      compression: xz
      scripts:
        posttrans: misc/packaging/scripts/plugin-posttrans.sh

  - id: xolo-plugin-dummy-model
    package_name: xolo-plugin-dummy-model
