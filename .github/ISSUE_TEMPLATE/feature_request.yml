name: Feature request
description: Propose a change or a new capability
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Issues may be written in English or French. / Les tickets peuvent être rédigés en anglais ou en français.

        For significant changes, opening an issue before writing code is the expected path (see CONTRIBUTING.md).
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What problem are you trying to solve? Describe the need, not only the solution.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
