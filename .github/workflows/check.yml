name: check

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    env:
      CGO_ENABLED: 0
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.27.0"

      - name: Build
        run: go build -v ./...

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y openjdk-21-jdk tesseract-ocr tesseract-ocr-fra tesseract-ocr-eng

      - name: Test
        run: go test ./...

      - uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: latest
          args: release --clean --snapshot ${{ env.flags }}
        env:
          REPO_OWNER: ${{ github.repository_owner }}

  # Runs the store suite against both storage backends. The `build` job above
  # only covers SQLite; here testcontainers starts a throwaway PostgreSQL on the
  # runner's Docker daemon so every store behaviour is asserted on both.
  integration:
    env:
      CGO_ENABLED: 0
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.27.0"

      # Pre-pulling keeps the container start-up out of the test timeout and
      # makes an image pull failure a distinct, readable step failure.
      - name: Pull PostgreSQL image
        run: docker pull postgres:17-alpine

      - name: Integration tests
        run: make test-integration
