name: check

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    env:
      CGO_ENABLED: 0
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.27.0"

      - name: Build
        run: go build -v ./...

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y openjdk-21-jdk tesseract-ocr tesseract-ocr-fra tesseract-ocr-eng

      - name: Test
        run: go test ./...

      # pkg/pluginsdk is a nested Go module: the root ./... pattern does not
      # reach it, so it gets its own step.
      - name: Test plugin SDK
        run: cd pkg/pluginsdk && go test ./...

      - uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: latest
          args: release --clean --snapshot ${{ env.flags }}
        env:
          REPO_OWNER: ${{ github.repository_owner }}

  # Runs the store suite against both storage backends. The `build` job above
  # only covers SQLite; here testcontainers starts a throwaway PostgreSQL on the
  # runner's Docker daemon so every store behaviour is asserted on both.
  integration:
    env:
      CGO_ENABLED: 0
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.27.0"

      # Pre-pulling keeps the container start-up out of the test timeout and
      # makes an image pull failure a distinct, readable step failure.
      - name: Pull PostgreSQL image
        run: docker pull postgres:17-alpine

      - name: Integration tests
        run: make test-integration

  # Drives a real server, built from the working tree, over HTTP against a fake
  # provider: built-in pipeline nodes, the shipped plugins and the events they
  # record (see test/e2e/README.md for the scenario list). The pseudonymizer
  # plugin downloads its NER models on first use, the CRF ones of go-anon and
  # the indecis one; the cache keeps those downloads out of the test timeout
  # on later runs.
  e2e:
    env:
      CGO_ENABLED: 0
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.27.0"

      - name: Cache NER models
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/go-anon
            ~/.cache/indecis-ner
          key: ner-models-${{ runner.os }}-v2

      - name: End-to-end tests
        run: make test-e2e

  # Builds docs/ exactly as the xolo-gateway/docs publication does (Zensical,
  # --strict, fr/en/es). Without it, a broken link or anchor only surfaces
  # once the docs repository fails to publish the merged commit or the tag.
  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Build documentation in strict mode
        run: make docs-check

  # Generated files are committed (see .gitattributes for why). Nothing else in
  # the pipeline regenerates them, so without this job a `.templ` edit shipped
  # without its `_templ.go` would build and pass tests against the stale output.
  # Re-runs the generators and fails if the result differs from what is checked
  # in. Excludes the protobuf output, which needs a system protoc whose version
  # would itself become a source of spurious diffs; `make generate-proto` stays
  # a manual step.
  generated:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.27.0"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Regenerate templ output and Tailwind stylesheet
        run: make generate

      - name: Rebuild the pipeline editor bundle
        run: make build-frontend

      - name: Check for stale generated files
        run: |
          if ! git diff --exit-code; then
            echo "::error::Generated files are out of date. Run 'make generate build-frontend' and commit the result."
            exit 1
          fi
