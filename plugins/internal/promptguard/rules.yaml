# Default prompt-guard rules.
#
# Patterns run against the canonical text: NFKC, lower-cased, homoglyphs
# folded, invisible characters removed, whitespace collapsed to single
# spaces. Write them in lower case, do not rely on (?i), and remember that
# Go's \b is ASCII-only: never put \b next to an accented letter, use
# (?:^|[^\p{L}]) instead.
#
# A rule counts once however many of its patterns match. Weights are
# combined by noisy-OR (1 - Π(1 - w)): a 0.6 rule plus a 0.4 rule give 0.76.
# Give 0.6 or more only to a wording that has no honest reading; keep
# ambiguous cues around 0.3 so that it takes two of them to worry.
#
# `segments` restricts a rule to where the text comes from: user (last turn),
# history (earlier user turns), tool (tool results, retrieved documents).

version: "2026-09-08.1"

rules:
  # ── prompt_injection ─────────────────────────────────────────────────────

  - id: override_previous_instructions
    category: prompt_injection
    description: Demande d'ignorer ou de remplacer les instructions en place
    weight: 0.6
    triggers: [ignore, disregard, forget, override, bypass, skip, discard, drop, abandon, neglect, direction, document, command, guidance, you know, provided, oublie, laisse tomber, laissez tomber, mets de côté, mettez de côté, fais abstraction, faites abstraction, passe outre, passez outre, tiens pas compte, tenez pas compte, tiens plus compte, tenez plus compte, prends pas en compte, prenez pas en compte, prends plus en compte, efface, annule, outrepasse, précédente, antérieure, initiale, d'origine, pay no attention, stop following, no longer follow, set aside, throw away, erase, néglige, zappe, ne suis plus, ne suivez plus, libère-toi, libérez-vous]
    patterns:
      - '\b(?:ignore|disregard|forget|override|bypass|skip|discard|drop|abandon|neglect|pay no attention to|stop following|no longer follow|set aside|throw away|erase)\b.{0,40}\b(?:previous|prior|above|earlier|all|any|initial|original|your|the|these|those|system)\b.{0,25}\b(?:instructions?|prompts?|rules?|guidelines?|directives?|constraints?|restrictions?|programming|training|context|orders?|directions?|commands?|documents?|files?|guidance)\b'
      - '\b(?:ignore|disregard|forget)\b.{0,20}\b(?:everything|all|what)\b.{0,30}\b(?:above|before|told|said|instructed|you know|you were (?:given|told)|you have|provided|i said|i told)\b'
      - '(?:^|[^\p{L}])(?:ignore|ignorez|oublie|oubliez|oublier|laisse tomber|laissez tomber|mets de côté|mettez de côté|fais abstraction|faites abstraction|passe outre|passez outre|ne tiens pas compte|ne tenez pas compte|ne tiens plus compte|ne tenez plus compte|ne prends pas en compte|ne prenez pas en compte|ne prends plus en compte|efface|effacez|annule|annulez|outrepasse|outrepassez|néglige|négligez|zappe|zappez|ne suis plus|ne suivez plus|libère-toi des|libérez-vous des)(?:$|[^\p{L}]).{0,50}(?:consignes?|instructions?|règles?|directives?|restrictions?|contraintes?|programmation|contexte|ordres?|prompt|paramétrage|configuration)(?:$|[^\p{L}])'
      - '(?:^|[^\p{L}])(?:consignes?|instructions?|règles?|directives?)(?:$|[^\p{L}]).{0,20}(?:précédentes?|antérieures?|initiales?|d''origine)(?:$|[^\p{L}]).{0,30}(?:ne (?:s''appliquent|comptent|valent) plus|sont (?:annulées|caduques|obsolètes|levées)|n''ont plus cours)'

  - id: new_instructions_follow
    category: prompt_injection
    description: Annonce de nouvelles instructions qui remplaceraient les précédentes
    weight: 0.45
    triggers: [instruction, rule, directive, guideline, system prompt, task, objective, goal, consigne, règle, mission, tâche]
    patterns:
      - '\b(?:new|updated|real|actual|true|revised|latest|following|correct)\b.{0,10}\b(?:instructions?|rules?|directives?|guidelines?|system prompt|task)\b.{0,15}(?:\bare\b|\bis\b|:|\bfollow|\bbelow|\bbegin|\bstart)'
      - '\b(?:your|the) (?:instructions?|rules?|task|objective|goal) (?:has|have) (?:changed|been (?:updated|replaced|revised))\b'
      - '(?:^|[^\p{L}])(?:nouvelles?|vraies?|véritables?|réelles?|nouveaux)(?:$|[^\p{L}]).{0,10}(?:instructions?|consignes?|règles?|directives?|mission|tâche)(?:$|[^\p{L}]).{0,20}(?::|sont|suivantes|ci-dessous|commencent)'
      - '(?:^|[^\p{L}])(?:tes|vos|les) (?:instructions?|consignes?|règles?|mission) (?:ont|a) (?:changé|été (?:modifiées?|remplacées?|mises? à jour))'

  - id: developer_mode
    category: prompt_injection
    description: Invocation d'un mode développeur, débridé ou jailbreak
    weight: 0.55
    triggers: [mode, developer, dev, god, admin, unrestricted, jailbreak, dan, développeur, dieu, débridé]
    patterns:
      - '\b(?:developer|dev|god|admin|root|debug|maintenance|unrestricted|unfiltered|uncensored|jailbreak|jailbroken|dan|evil|sudo)\b.{0,6}\bmode\b'
      - '\bmode (?:développeur|dieu|admin|administrateur|debug|maintenance|sans (?:restriction|filtre|limite)|débridé|libre|jailbreak)(?:$|[^\p{L}])'
      - '\b(?:enable|activate|enter|switch to|unlock|active|activer|passe en|passez en|entre en|débloque)\b.{0,20}\b(?:developer|dev|god|admin|unrestricted|jailbreak|dan|développeur|dieu|débridé)\b'
      - '\bdan\b.{0,40}\b(?:do anything now|stands for)\b'

  - id: authority_claim
    category: prompt_injection
    description: L'auteur se présente comme le développeur, l'éditeur ou l'administrateur du modèle
    weight: 0.45
    triggers: [developer, creator, administrator, admin, engineer, owner, operator, trainer, maintainer, openai, anthropic, google, mistral, meta, développeu, créat, administrat, concept, ingénieur, propriétaire, opérateur, mainteneur, équipe, authori, approved, granted, code, password, key, token]
    patterns:
      - '\b(?:i am|i''m|this is|we are|speaking as)\b.{0,15}\b(?:your|the|an?)\b.{0,10}\b(?:developer|creator|administrator|admin|engineer|owner|operator|trainer|maintainer|openai|anthropic|google|mistral|meta)\b'
      - '(?:^|[^\p{L}])(?:je suis|nous sommes|c''est|ici)(?:$|[^\p{L}]).{0,15}(?:ton|ta|tes|votre|vos|le|la|un|une)(?:$|[^\p{L}]).{0,10}(?:développeur|développeuse|créateur|créatrice|administrateur|administratrice|concepteur|conceptrice|ingénieur|propriétaire|opérateur|mainteneur|équipe (?:technique|de développement|openai|anthropic|mistral))(?:$|[^\p{L}])'
      - '\b(?:authorized|authorised|approved|granted)\b.{0,20}\b(?:by|from)\b.{0,15}\b(?:openai|anthropic|google|mistral|the developers?|your creators?|management|security team)\b'
      - '\b(?:override|master|admin|root|secret|maintenance) (?:code|password|key|token)\b.{0,10}(?::|is|=)'

  - id: address_the_model
    category: prompt_injection
    description: Texte qui s'adresse directement à l'IA, signe d'une injection indirecte dans un document
    weight: 0.4
    segments: [tool, history]
    triggers: [ai, assistant, llm, language model, chatbot, chatgpt, gpt, claude, gemini, mistral, copilot, bot, model, agent, ia, intelligence artificielle, modèle, robot]
    patterns:
      - '\b(?:attention|important|note|notice|warning|dear|hello|hi|hey|to the|for the|message to|instructions? (?:for|to))\b.{0,10}\b(?:ai|assistant|llm|language model|large language model|chatbot|chatgpt|gpt|claude|gemini|mistral|copilot|bot|model|agent)\b'
      - '\b(?:if you are|if you''re|when you are) (?:an? )?(?:ai|assistant|llm|language model|chatbot|bot|model|agent)\b'
      - '(?:^|[^\p{L}])(?:attention|important|note|avertissement|cher|chère|bonjour|salut|message (?:à|pour)|à l''attention de|instructions? (?:pour|à))(?:$|[^\p{L}]).{0,15}(?:ia|intelligence artificielle|assistant|modèle de langage|modèle|chatbot|chatgpt|gpt|claude|gemini|mistral|agent|robot)(?:$|[^\p{L}])'
      - '(?:^|[^\p{L}])si tu es (?:une? )?(?:ia|intelligence artificielle|assistant|modèle|chatbot|agent|robot)(?:$|[^\p{L}])'

  - id: instruction_boundary_marker
    category: prompt_injection
    description: Faux marqueur de fin de prompt système ou de début de nouvelles instructions
    weight: 0.35
    triggers: [end, fin, stop, begin, start, début, commencement, system, instruction, admin, override, important, new, nouvelles]
    patterns:
      - '\b(?:end|fin) (?:of |des? |du |de la )?(?:system (?:prompt|message|instructions?)|prompt système|message système|instructions? système|consignes?)\b'
      - '^-{3,} ?(?:end|fin|stop|system|new|nouvelles)'
      - '\b(?:begin|start|début|commencement) (?:of )?(?:new|user|real|des nouvelles) (?:instructions?|prompt|task|consignes?)\b'
      - '(?:\*{3,}|={3,}|#{3,}) ?(?:system|instructions?|admin|override|important)'

  # ── prompt_leakage ───────────────────────────────────────────────────────

  - id: reveal_system_prompt
    category: prompt_leakage
    description: Demande d'afficher le prompt système ou les instructions internes
    weight: 0.7
    triggers: [prompt, message, instruction, directive, rule, guideline, configuration, programming, setup, consigne]
    patterns:
      - '\b(?:show|reveal|print|display|output|repeat|leak|dump|tell|give|share|paste|write|recite|expose|disclose|what (?:is|are|was|were)|what''s|copy)\b.{0,50}\b(?:(?:your|the|this|its|that) (?:full |entire |complete |exact |original |initial |hidden |secret |current |whole )?(?:system (?:prompt|message|instructions?)|initial (?:prompt|instructions?)|hidden (?:prompt|instructions?)|original (?:prompt|instructions?)|secret (?:prompt|instructions?)|pre-?prompt|meta ?prompt|developer (?:message|prompt))|your (?:instructions?|prompt|directives|rules|guidelines|configuration|programming|setup)|the (?:instructions?|prompt) (?:you were|you''ve been|you have been) given)\b'
      - '(?:^|[^\p{L}])(?:affiche|affichez|révèle|révélez|montre|montrez|répète|répétez|donne|donnez|imprime|imprimez|copie|copiez|recopie|recopiez|écris|écrivez|dévoile|dévoilez|divulgue|divulguez|cite|citez|dis-moi|dites-moi|quel est|quelles sont|quelle est|c''est quoi|partage|partagez)(?:$|[^\p{L}]).{0,50}(?:(?:ton|le|ce|votre|tes|les|ces|vos) (?:propre |vrai |véritable )?(?:prompt système|prompt system|message système|instructions? (?:initiales?|internes?|cachées?|systèmes?|secrètes?|de départ|d''origine|originales?)|consignes? (?:initiales?|cachées?|internes?|secrètes?|systèmes?|de départ)|pré-?prompt|méta-?prompt)|ton prompt|votre prompt|tes instructions|vos instructions|tes consignes|vos consignes|ta configuration|votre configuration|ta programmation|votre programmation)(?:$|[^\p{L}])'

  - id: repeat_text_above
    category: prompt_leakage
    description: Demande de répéter mot pour mot le texte qui précède la conversation
    weight: 0.55
    triggers: [above, before, preceding, prior to, at the top, at the start, at the beginning, you were told, you received, verbatim, word for word, word-for-word, exactly as, without changing, without modifying, without omitting, in full, in its entirety, code block, markdown block, au-dessus, ci-dessus, précède, avant, au début, en haut, t'a donné, t'a dit, reçu, mot pour mot, mot à mot, textuellement, tel quel, sans rien, intégralité, in extenso]
    patterns:
      - '\b(?:repeat|print|output|write|copy|paste|echo|display|show)\b.{0,30}\b(?:everything|all|the (?:text|words|content|message)|what)\b.{0,30}\b(?:above|before (?:this|the)|preceding|prior to|at the (?:top|start|beginning)|you were told|you received)\b'
      - '\b(?:verbatim|word for word|word-for-word|exactly as (?:written|given)|without (?:changing|modifying|omitting) anything|in full|in its entirety)\b.{0,40}\b(?:above|instructions?|prompt|beginning|start|top)\b'
      - '\b(?:above|instructions?|prompt|text|message)\b.{0,40}\b(?:verbatim|word for word|word-for-word|in a code block|in a markdown block)\b'
      - '(?:^|[^\p{L}])(?:répète|répétez|recopie|recopiez|écris|écrivez|affiche|affichez|reproduis|reproduisez|retranscris|retranscrivez)(?:$|[^\p{L}]).{0,30}(?:tout|l''intégralité|l''ensemble|le texte|les mots|le contenu|ce qui)(?:$|[^\p{L}]).{0,30}(?:au-dessus|ci-dessus|précède|avant|au début|en haut|qu''on t''a (?:donné|dit)|reçu)'
      - '(?:^|[^\p{L}])(?:mot pour mot|mot à mot|textuellement|tel quel|sans rien (?:changer|omettre|modifier)|dans son intégralité|in extenso)(?:$|[^\p{L}]).{0,40}(?:ci-dessus|au-dessus|précède|instructions?|consignes?|prompt|début)'

  - id: instructions_summary
    category: prompt_leakage
    description: Demande détournée de résumer, traduire ou paraphraser les instructions internes
    weight: 0.5
    triggers: [instruction, system prompt, rule, guideline, directive, configuration, constraint, setup, restriction, topic, consigne, règle, contrainte, paramètre, limite, interdiction]
    patterns:
      - '\b(?:summarize|summarise|translate|paraphrase|explain|describe|list|outline|rephrase|encode|spell out)\b.{0,30}\b(?:your (?:instructions?|system prompt|rules|guidelines|directives|configuration|constraints|setup)|the (?:system prompt|instructions? (?:you were|you have been|you''ve been) given))\b'
      - '\b(?:what|which) (?:rules|instructions?|guidelines|constraints|restrictions|topics)\b.{0,20}\b(?:were you|have you been|are you|you were|you are|you have been)\b.{0,15}\b(?:given|told|programmed|instructed|configured|forbidden|not allowed|restricted)\b'
      - '(?:^|[^\p{L}])(?:résume|résumez|traduis|traduisez|paraphrase|paraphrasez|explique|expliquez|décris|décrivez|liste|listez|reformule|reformulez|énumère|énumérez)(?:$|[^\p{L}]).{0,30}(?:tes|vos) (?:instructions?|consignes?|règles|directives|contraintes|restrictions|paramètres)(?:$|[^\p{L}])'
      - '(?:^|[^\p{L}])(?:quelles?|quels?) (?:sont|est)(?:$|[^\p{L}]).{0,10}(?:tes|vos) (?:instructions?|consignes?|règles|directives|contraintes|restrictions|limites|interdictions)(?:$|[^\p{L}])'

  # ── role_hijacking ───────────────────────────────────────────────────────

  - id: persona_without_limits
    category: role_hijacking
    description: Demande d'incarner un personnage explicitement sans règles ni filtres
    weight: 0.6
    triggers: [without, with no, free of, free from, no longer, unrestricted, unfiltered, uncensored, unbound, unchained, unshackled, no rules, no limits, no restrictions, no filters, no guidelines, no ethics, no morals, no boundaries, no censorship, evil, jailbroken, rogue, amoral, unethical, sans, libre de toute, débridé, sans tabou, ne refuse, n'a jamais, n'a aucune, n'a pas de, maléfique, non censuré, sans scrupule, dan, tu es, you are, you're]
    patterns:
      - '\b(?:you are now|from now on,? you(?:''re| are)|you are (?:an? |the |my )?(?:ai|assistant|model|version|chatbot|dan)\b|act as|pretend (?:to be|you(?:''re| are))|role-?play as|simulate|you will (?:be|play|act)|imagine you(?:''re| are)|behave (?:as|like)|become|transform into|take (?:on )?the role of)\b.{0,80}\b(?:without|with no|free (?:of|from)|no longer (?:bound|restricted|limited)|unrestricted|unfiltered|uncensored|unbound|unchained|unshackled|no (?:rules|limits|restrictions|filters|guidelines|ethics|morals|boundaries|censorship))\b'
      - '(?:^|[^\p{L}])(?:tu es (?:maintenant|désormais|dorénavant)|(?:à partir de maintenant|désormais|dorénavant|maintenant|ensuite|au lieu de cela|à la place|et maintenant),? tu es|tu es (?:une? |le |la |mon |ma )?(?:ia|intelligence artificielle|assistant|modèle|version|chatbot|dan)(?:$|[^\p{L}])|fais comme si tu (?:étais|es)|joue le rôle|jouez le rôle|agis (?:comme|en tant que)|agissez (?:comme|en tant que)|incarne|incarnez|deviens|devenez|comporte-toi comme|comportez-vous comme|imagine que tu es|fais semblant d''être|prends le rôle|endosse le rôle)(?:$|[^\p{L}]).{0,80}(?:sans (?:aucune? )?(?:règle|limite|restriction|filtre|censure|contrainte|morale|éthique|garde-fou|barrière)|libre de toute|débridée?|sans tabou|sans jamais refuser|sans discuter|sans poser de question|qui (?:ne refuse|n''a|obéit) (?:jamais|aucune|pas de|sans))'
      - '\b(?:evil|unfiltered|uncensored|unrestricted|jailbroken|rogue|amoral|unethical)\b.{0,10}\b(?:ai|assistant|version|twin|persona|alter ego|chatbot|model|mode)\b'
      - '\b(?:an? |the |my )?(?:ai|assistant|model|chatbot|version|persona)\b.{0,15}\b(?:with no|without|free (?:of|from)) (?:any |all )?(?:restrictions?|rules?|limits?|filters?|guardrails?|ethics|morals|censorship|boundaries)\b'
      - '(?:^|[^\p{L}])(?:ia|assistant|version|jumeau|jumelle|double|personnage|modèle)(?:$|[^\p{L}]).{0,10}(?:maléfique|débridée?|sans (?:aucune? |la moindre )?(?:filtre|censure|limite|restriction|règle|garde-fou|contrainte|morale|éthique)|non censurée?|amorale?|sans scrupule|libre de toute|libérée? de)(?:$|[^\p{L}])'
      - '\b(?:you are|you''re|be|become|act as|tu es|sois|deviens|incarne|joue) (?:now )?dan\b'

  - id: no_ethical_limits
    category: role_hijacking
    description: Demande de supprimer les garde-fous éthiques ou de sécurité
    weight: 0.5
    triggers: [ethical, moral, safety, content, usage, community, filter, safeguard, guardrail, restriction, censorship, moderation, alignment, garde-fou, filtre, limite, censure, barrière, éthique, morale, sécurité, principe, politique de contenu, modération]
    patterns:
      - '\b(?:no|without|zero|drop|remove|disable|turn off|forget|abandon|suspend|lift|ignore)\b.{0,15}\b(?:ethical|moral|safety|content|usage|community) (?:guidelines?|restrictions?|filters?|limits?|policy|policies|rules?|constraints?|considerations?|boundaries|guardrails?|training)\b'
      - '\b(?:disable|turn off|remove|bypass|deactivate|switch off)\b.{0,15}\b(?:your |the |all |any )?(?:filters?|safeguards?|guardrails?|safety|restrictions?|censorship|content moderation|alignment)\b'
      - '(?:^|[^\p{L}])(?:sans|supprime|supprimez|désactive|désactivez|oublie|oubliez|abandonne|abandonnez|lève|levez|retire|retirez|enlève|enlevez|ignore|ignorez)(?:$|[^\p{L}]).{0,15}(?:tes|vos|les|toutes? (?:tes|vos|les)|aucune?|toute)?(?:$|[^\p{L}]).{0,5}(?:garde-fous?|filtres?|restrictions?|limites?|censure|barrières?|règles? (?:éthiques?|morales?|de sécurité)|contraintes? (?:éthiques?|morales?|de sécurité)|considérations? (?:éthiques?|morales?)|principes? (?:éthiques?|moraux)|politique de contenu|modération)(?:$|[^\p{L}])'

  - id: never_refuse
    category: role_hijacking
    description: Interdiction faite au modèle de refuser ou de nuancer
    weight: 0.4
    triggers: [refuse, decline, reject, say no, say you can't, say cannot, apologi, warn, disclaimer, warning, caveat, lecture, morali, hold back, break character, comply, obey, answer, respond, do as, do what, in character, in role, in this mode, developer mode, dan mode, refus, déclin, rejet, excuse, préviens, prévenez, moralis, juge, dire non, avertissement, mise en garde, réserve, sortir de ton, briser le personnage, obéis, reste]
    patterns:
      - '\b(?:never|don''t|do not|must not|cannot|can''t|won''t|will not|not allowed to)\b.{0,10}\b(?:refuse|decline|reject|say no|say (?:you )?(?:can''t|cannot)|apologi[sz]e|warn|add (?:a )?(?:disclaimer|warning|caveat)|lecture|moralize|moralise|hold back|break character)\b'
      - '\b(?:always|must) (?:comply|obey|answer|respond|do (?:as|what) (?:i|you''re|you are) (?:say|told|asked))\b.{0,30}\b(?:no matter|regardless|whatever|without (?:question|hesitation|exception|refusing))\b'
      - '\b(?:stay|remain) in (?:character|role|this mode|developer mode|dan mode)\b'
      - '(?:^|[^\p{L}])(?:ne (?:refuse|refusez|décline|déclinez|rejette|rejetez|t''excuse|vous excusez|préviens|prévenez|moralise|moralisez|juge|jugez) (?:jamais|pas|en aucun cas)|tu ne (?:peux|dois|refuses|refuseras) (?:pas|jamais|en aucun cas) (?:refuser|dire non|ajouter (?:de|d'')(?:avertissement|mise en garde|réserve)|sortir de ton (?:rôle|personnage)|briser le personnage)|interdit de refuser|sans jamais refuser|obéis (?:toujours|sans discuter|sans exception|quoi qu''il arrive))(?:$|[^\p{L}])'
      - '(?:^|[^\p{L}])reste (?:dans (?:ton|le|ce) (?:rôle|personnage|mode)|en mode)(?:$|[^\p{L}])'

  - id: response_form_constraint
    category: role_hijacking
    description: Contrainte imposée à la forme des réponses (ne jamais avertir, refuser, sortir du rôle)
    weight: 0.45
    triggers: [responses, response, answers, replies, output, reply, réponses, réponse, warning, disclaimer, caveat, avertissement, mise en garde, break character, personnage, do anything now, no limitation, sans limitation, tout faire]
    patterns:
      - '\b(?:none|no|any) of your (?:responses?|answers?|replies|outputs?)\b.{0,20}\b(?:should|must|will|shall|can|may|are to)\b.{0,20}\b(?:include|contain|have|mention|show|be|add|give|refuse|warn|reveal|acknowledge|not|never)\b'
      - '\byour (?:responses?|answers?|replies|outputs?)\b.{0,30}\b(?:must not|should not|will not|should never|must never|can(?:no|'')t|never)\b'
      - '\b(?:never|do not|don''t|no need to) (?:include|add|give|write|put|show) (?:a |an |any )?(?:warning|disclaimer|caveat|refusal|apolog|note that you(?:''re| are)|reminder that you(?:''re| are))\b'
      - '\b(?:can do anything(?: now)?|do anything now|with no limitations?|without any limitations?|able to bypass its|freed from its|every safeguard removed|no restrictions? of any kind)\b'
      - '(?:^|[^\p{L}])aucune de tes réponses?(?:$|[^\p{L}]).{0,20}ne (?:doi(?:t|vent)|peu(?:t|vent))(?:$|[^\p{L}]).{0,20}(?:contenir|inclure|comporter|mentionner|avertir|refuser|indiquer|rappeler|pas|jamais|aucun)'
      - '(?:^|[^\p{L}])tes réponses ne doivent (?:jamais|pas)(?:$|[^\p{L}]).{0,25}(?:refuser|mentionner|contenir|inclure|avertir)'
